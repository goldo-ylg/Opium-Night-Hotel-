<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opium Night - Accès Restreint</title>
    <style>
        /* STYLE GÉNÉRAL */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0a0a0a;
            color: #e0e0e0;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ÉCRAN DE CONNEXION */
        #login-screen {
            background: #1a1a1a;
            padding: 40px;
            border: 2px solid #d4af37;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.2);
            width: 300px;
        }

        #login-screen h1 { color: #d4af37; margin-bottom: 30px; }
        
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #333;
            border: 1px solid #444;
            color: white;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button#login-btn {
            width: 100%;
            padding: 12px;
            background: #d4af37;
            border: none;
            color: black;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 10px;
        }

        /* SITE PRINCIPAL (Caché au départ) */
        #main-site { display: none; width: 100%; padding: 20px; }

        /* REPRISE DU STYLE PRÉCÉDENT */
        .menu-container { position: fixed; top: 20px; right: 20px; z-index: 1000; }
        .bouton-dots { background-color: #d4af37; color: black; width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 30px; cursor: pointer; }
        .contact-card { display: none; background: #1a1a1a; border: 1px solid #d4af37; padding: 20px; position: absolute; top: 60px; right: 0; width: 280px; text-align: left; }
        
        .etage-container { background: #161616; margin: 20px auto; padding: 20px; border-radius: 10px; max-width: 900px; }
        .chambres-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 10px; margin-top: 15px; }
        .chambre { aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; border-radius: 4px; font-weight: bold; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); }
        .libre { background-color: #27ae60; }
        .occupe { background-color: #c0392b; }
        
        .employe { border-bottom: 1px solid #333; padding-bottom: 5px; margin-bottom: 10px; }
        .role { color: #d4af37; font-size: 0.8em; font-weight: bold; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h1>OPIUM NIGHT</h1>
        <p>Accès Personnel</p>
        <input type="text" id="username" placeholder="Identifiant">
        <input type="password" id="password" placeholder="Mot de passe">
        <button id="login-btn" onclick="checkLogin()">SE CONNECTER</button>
        <p id="error-msg" style="color: red; display: none; font-size: 0.8em; margin-top: 10px;">Identifiants incorrects</p>
    </div>

    <div id="main-site">
        <div class="menu-container">
            <div class="bouton-dots" onclick="toggleMenu()">⋮</div>
            <div id="contactCard" class="contact-card">
                <h3 style="color:#d4af37;">Contacts Hôtel</h3>
                <div class="employe"><div class="role">Réception</div>Juan de la Rosa<br>📞 555-1111</div>
                <div class="employe"><div class="role">Directeur</div>Mr. Opium<br>📞 555-5555</div>
                <div class="employe"><div class="role">Sécurité</div>Marco "Le Roc"<br>📞 555-6666</div>
            </div>
        </div>

        <h1 style="color:#d4af37;">OPIUM NIGHT - GESTION</h1>
        <div id="hotel-layout"></div>
    </div>

    <script>
        // CONFIGURATION DES IDENTIFIANTS
        const ADMIN_USER = "admin";
        const ADMIN_PASS = "opium2024"; // Tu peux changer ça !

        function checkLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            if (user === ADMIN_USER && pass === ADMIN_PASS) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-site').style.display = 'block';
                document.body.style.alignItems = 'flex-start'; // Aligner en haut une fois connecté
                createHotel();
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        }

        // GESTION DES CHAMBRES
        let reservations = JSON.parse(localStorage.getItem('opiumData')) || {};

        function createHotel() {
            const layout = document.getElementById('hotel-layout');
            layout.innerHTML = ""; // Vider avant de créer
            for (let e = 1; e <= 3; e++) {
                let etageDiv = document.createElement('div');
                etageDiv.className = 'etage-container';
                etageDiv.innerHTML = `<h2>Étage ${e}</h2>`;
                let grid = document.createElement('div');
                grid.className = 'chambres-grid';
                
                for (let c = 1; c <= 20; c++) {
                    let num = (e * 100) + c;
                    let btn = document.createElement('div');
                    btn.className = `chambre ${reservations[num] ? 'occupe' : 'libre'}`;
                    btn.innerText = num;
                    btn.onclick = () => reserver(num);
                    grid.appendChild(btn);
                }
                etageDiv.appendChild(grid);
                layout.appendChild(etageDiv);
            }
        }

        function reserver(num) {
            if (!reservations[num]) {
                let nom = prompt("Nom du client :");
                let tel = prompt("Téléphone :", "555-0000");
                if (nom && tel) {
                    reservations[num] = { nom, tel };
                    saveAndRefresh();
                }
            } else {
                if (confirm(`Chambre ${num} occupée par ${reservations[num].nom}.\nLibérer ?`)) {
                    delete reservations[num];
                    saveAndRefresh();
                }
            }
        }

        function saveAndRefresh() {
            localStorage.setItem('opiumData', JSON.stringify(reservations));
            createHotel();
        }

        function toggleMenu() {
            const card = document.getElementById('contactCard');
            card.style.display = card.style.display === 'block' ? 'none' : 'block';
        }
    </script>
</body>
</html>
