<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Opium Night Hotel</title>

<style>

body{
font-family: Arial;
background:#111;
color:white;
text-align:center;
}

h1{
margin-top:20px;
}

.floor{
margin:20px;
}

.room{
width:60px;
height:60px;
margin:5px;
border:none;
cursor:pointer;
font-weight:bold;
}

.free{
background:green;
}

.reserved{
background:red;
}

#menu{
position:absolute;
top:20px;
right:20px;
font-size:25px;
cursor:pointer;
}

#contacts{
display:none;
position:absolute;
right:20px;
top:60px;
background:#222;
padding:15px;
border-radius:10px;
}

</style>
</head>

<body>

<h1>Opium Night Hotel</h1>

<div id="menu" onclick="toggleMenu()">⋮</div>

<div id="contacts">

<h3>Contacts Hôtel</h3>

<p>Réceptionniste<br>
Juan De La Rosa<br>
555-1111</p>

<p>Major d'homme<br>
Marco Silva<br>
555-2222</p>

<p>Barmaid<br>
Anna Lopez<br>
555-3333</p>

<p>Femme de ménage<br>
Sofia Martinez<br>
555-4444</p>

<p>Directeur<br>
Victor Kane<br>
555-5555</p>

<p>Chef sécurité<br>
Carlos Vega<br>
555-6666</p>

</div>

<div id="hotel"></div>

<script>

let hotel = document.getElementById("hotel")

for(let floor=1; floor<=3; floor++){

let floorDiv = document.createElement("div")
floorDiv.className="floor"

let title = document.createElement("h2")
title.innerText="Etage "+floor

floorDiv.appendChild(title)

for(let room=1; room<=20; room++){

let roomNumber = floor*100 + room

let button = document.createElement("button")
button.className="room free"
button.innerText=roomNumber

button.onclick=function(){

if(button.classList.contains("reserved")){
alert("Chambre déjà réservée")
return
}

let name = prompt("Nom et prénom :")
let tel = prompt("Numéro de téléphone :")

if(name && tel){

button.classList.remove("free")
button.classList.add("reserved")

alert("Réservation confirmée")

}

}

floorDiv.appendChild(button)

}

hotel.appendChild(floorDiv)

}

function toggleMenu(){

let contacts = document.getElementById("contacts")

if(contacts.style.display=="block"){
contacts.style.display="none"
}else{
contacts.style.display="block"
}

}

</script>

</body>
</html>
