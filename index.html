<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opium Night - Système de Réservation</title>
    <style>
        /* --- STYLE DE BASE --- */
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: #0a0a0a;
            color: #e0e0e0;
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* --- CONNEXION --- */
        #login-screen {
            align-self: center;
            background: #1a1a1a;
            padding: 30px;
            border: 1px solid #d4af37;
            border-radius: 15px;
            text-align: center;
            width: 90%;
            max-width: 350px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: #222;
            border: 1px solid #444;
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }

        label { display: block; text-align: left; font-size: 0.8em; color: #d4af37; margin-top: 5px; }

        #login-btn, .btn-confirm {
            width: 100%;
            padding: 15px;
            background: #d4af37;
            border: none;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }

        /* --- SITE PRINCIPAL --- */
        #main-site { display: none; width: 100%; max-width: 1200px; padding: 20px; box-sizing: border-box; }
        h1 { color: #d4af37; text-align: center; text-transform: uppercase; letter-spacing: 2px; }

        /* --- MENU CONTACT --- */
        .menu-container { position: fixed; top: 15px; right: 15px; z-index: 2000; }
        .bouton-dots { 
            background: #d4af37; color: black; width: 50px; height: 50px; 
            border-radius: 10px; display: flex; align-items: center; 
            justify-content: center; font-size: 25px; cursor: pointer;
        }
        .contact-card {
            display: none; background: #1a1a1a; border: 1px solid #d4af37;
            padding: 20px; position: absolute; top: 60px; right: 0;
            width: 260px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        /* --- MODALE DE RÉSERVATION (LA CASE LONGUE) --- */
        #reservation-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1a1a1a;
            border: 2px solid #d4af37;
            padding: 25px;
            z-index: 3000;
            width: 90%;
            max-width: 400px;
            border-radius: 15px;
            box-shadow: 0 0 50px rgba(0,0,0,1);
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 2500;
        }

        /* --- GRILLE DES CHAMBRES --- */
        .etage-container { background: #161616; margin: 20px 0; padding: 15px; border-radius: 12px; border-left: 4px solid #d4af37; }
        .chambres-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 8px; margin-top: 10px; }
        .chambre { aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .libre { background: #27ae60; }
        .occupe { background: #c0392b; }

        @media (max-width: 768px) { .chambres-grid { grid-template-columns: repeat(5, 1fr); } }
    </style>
</head>
<body onclick="closeMenuOutside(event)">

    <div id="login-screen">
        <h2 style="color:#d4af37">OPIUM NIGHT</h2>
        <input type="text" id="username" placeholder="Identifiant">
        <input type="password" id="password" placeholder="Mot de passe">
        <button id="login-btn" onclick="checkLogin()">ACCÉDER</button>
    </div>

    <div id="main-site">
        <div class="menu-container" id="menuArea">
            <div class="bouton-dots" onclick="toggleMenu(event)">⋮</div>
            <div id="contactCard" class="contact-card">
                <h3 style="color:gold; margin-top:0;">Personnel</h3>
                <div style="margin-bottom:10px;"><strong>Juan de la Rosa</strong><br><small>Réception</small><br>📞 555-1111</div>
                <div style="margin-bottom:10px;"><strong>Esmeralda Cuervo</strong><br><small>Barmaid</small><br>📞 555-7153</div>
                <div style="margin-bottom:10px;"><strong>Carmila Almeida</strong><br><small>Organisatrices d’évent </small><br>📞 555-9269</div>
                <button style="background:#c0392b; color:white; border:none; width:100%; padding:8px; border-radius:5px; cursor:pointer;" onclick="logout()">DÉCONNEXION</button>
            </div>
        </div>

        <h1>OPIUM NIGHT</h1>
        <div id="hotel-layout"></div>
    </div>

    <div class="overlay" id="overlay" onclick="closeModal()"></div>
    <div id="reservation-modal">
        <h2 id="modal-title" style="color:gold; margin-top:0;">Réservation</h2>
        
        <label>Nom & Prénom</label>
        <input type="text" id="cust-name" placeholder="Ex: Jean Dupont">
        
        <label>Numéro de Téléphone</label>
        <input type="text" id="cust-tel" placeholder="Ex: 555-0000">
        
        <div style="display: flex; gap: 10px;">
            <div style="flex:1">
                <label>Date d'arrivée</label>
                <input type="date" id="date-start">
            </div>
            <div style="flex:1">
                <label>Date de départ</label>
                <input type="date" id="date-end">
            </div>
        </div>

        <button class="btn-confirm" id="btn-save" onclick="saveReservation()">CONFIRMER</button>
        <button onclick="closeModal()" style="background:none; border:none; color:#888; width:100%; margin-top:10px; cursor:pointer;">Annuler</button>
    </div>

    <script>
        const USER = "Kala01";
        const PASS = "Opium00";
        let db = JSON.parse(localStorage.getItem('opiumResa')) || {};
        let currentRoom = null;

        function checkLogin() {
            if(document.getElementById('username').value === USER && document.getElementById('password').value === PASS) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-site').style.display = 'block';
                renderHotel();
            } else { alert("Accès refusé"); }
        }

        function logout() { location.reload(); }

        function renderHotel() {
            const container = document.getElementById('hotel-layout');
            container.innerHTML = "";
            for (let e = 1; e <= 3; e++) {
                let section = document.createElement('div');
                section.className = 'etage-container';
                section.innerHTML = `<h3>Étage ${e}</h3>`;
                let grid = document.createElement('div');
                grid.className = 'chambres-grid';
                for (let c = 1; c <= 20; c++) {
                    let num = (e * 100) + c;
                    let box = document.createElement('div');
                    box.className = `chambre ${db[num] ? 'occupe' : 'libre'}`;
                    box.innerText = num;
                    box.onclick = () => openBooking(num);
                    grid.appendChild(box);
                }
                section.appendChild(grid);
                container.appendChild(section);
            }
        }

        function openBooking(num) {
            currentRoom = num;
            if(!db[num]) {
                document.getElementById('modal-title').innerText = "Réserver Chambre " + num;
                document.getElementById('cust-name').value = "";
                document.getElementById('cust-tel').value = "";
                document.getElementById('date-start').value = "";
                document.getElementById('date-end').value = "";
                document.getElementById('btn-save').innerText = "CONFIRMER LA RÉSERVATION";
                document.getElementById('btn-save').style.background = "#d4af37";
            } else {
                const data = db[num];
                document.getElementById('modal-title').innerText = "Détails Chambre " + num;
                document.getElementById('cust-name').value = data.name;
                document.getElementById('cust-tel').value = data.tel;
                document.getElementById('date-start').value = data.start;
                document.getElementById('date-end').value = data.end;
                document.getElementById('btn-save').innerText = "LIBÉRER LA CHAMBRE";
                document.getElementById('btn-save').style.background = "#c0392b";
            }
            document.getElementById('reservation-modal').style.display = 'block';
            document.getElementById('overlay').style.display = 'block';
        }

        function saveReservation() {
            if(!db[currentRoom]) {
                const name = document.getElementById('cust-name').value;
                const tel = document.getElementById('cust-tel').value;
                const start = document.getElementById('date-start').value;
                const end = document.getElementById('date-end').value;

                if(name && tel && start && end) {
                    db[currentRoom] = { name, tel, start, end };
                    closeModal();
                } else { alert("Veuillez remplir tous les champs !"); }
            } else {
                if(confirm("Voulez-vous vraiment libérer cette chambre ?")) {
                    delete db[currentRoom];
                    closeModal();
                }
            }
            localStorage.setItem('opiumResa', JSON.stringify(db));
            renderHotel();
        }

        function closeModal() {
            document.getElementById('reservation-modal').style.display = 'none';
            document.getElementById('overlay').style.display = 'none';
        }

        function toggleMenu(event) {
            event.stopPropagation();
            const card = document.getElementById('contactCard');
            card.style.display = (card.style.display === 'block') ? 'none' : 'block';
        }

        function closeMenuOutside(event) {
            const card = document.getElementById('contactCard');
            if (card.style.display === 'block' && !document.getElementById('menuArea').contains(event.target)) {
                card.style.display = 'none';
            }
        }
    </script>
</body>
</html>
