<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opium Night - Gestion Mobile & PC</title>
    <style>
        /* --- BASE & COULEURS --- */
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0a0a0a;
            color: #e0e0e0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* --- ÉCRAN DE CONNEXION --- */
        #login-screen {
            align-self: center;
            background: #1a1a1a;
            padding: 30px;
            border: 1px solid #d4af37;
            border-radius: 15px;
            text-align: center;
            width: 90%;
            max-width: 350px;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.1);
        }

        #login-screen input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: #222;
            border: 1px solid #444;
            color: white;
            border-radius: 8px;
            font-size: 16px; /* Évite le zoom auto sur iPhone */
        }

        #login-btn {
            width: 100%;
            padding: 15px;
            background: #d4af37;
            border: none;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        /* --- SITE PRINCIPAL (Contenu) --- */
        #main-site { 
            display: none; 
            width: 100%; 
            max-width: 1200px; 
            padding: 20px; 
            box-sizing: border-box;
        }

        h1 { color: #d4af37; text-align: center; letter-spacing: 2px; }

        /* --- MENU CONTACT (Responsive) --- */
        .menu-container { position: fixed; top: 15px; right: 15px; z-index: 2000; }
        .bouton-dots { 
            background: #d4af37; color: black; width: 50px; height: 50px; 
            border-radius: 10px; display: flex; align-items: center; 
            justify-content: center; font-size: 25px; cursor: pointer;
        }

        .contact-card {
            display: none; background: #1a1a1a; border: 1px solid #d4af37;
            padding: 20px; position: absolute; top: 60px; right: 0;
            width: 260px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        /* --- GRILLE DES CHAMBRES RESPONSIVE --- */
        .etage-container {
            background: #161616; margin: 20px 0; padding: 15px;
            border-radius: 12px; border-left: 4px solid #d4af37;
        }

        .chambres-grid {
            display: grid;
            /* PAR DÉFAUT (PC) : 10 colonnes */
            grid-template-columns: repeat(10, 1fr);
            gap: 8px;
            margin-top: 10px;
        }

        .chambre {
            aspect-ratio: 1/1; display: flex; align-items: center;
            justify-content: center; border-radius: 6px; font-weight: bold;
            cursor: pointer; font-size: 14px; transition: 0.2s;
        }

        .libre { background: #27ae60; border: 1px solid #1e8449; }
        .occupe { background: #c0392b; border: 1px solid #922b21; }

        /* --- MEDIA QUERIES (ADAPTATION TÉLÉPHONE) --- */
        @media (max-width: 768px) {
            .chambres-grid {
                /* SUR TABLETTE : 5 colonnes */
                grid-template-columns: repeat(5, 1fr);
            }
            .contact-card {
                position: fixed; top: 0; left: 0; right: 0; bottom: 0;
                width: 100%; height: 100%; border-radius: 0; border: none;
                box-sizing: border-box;
            }
        }

        @media (max-width: 480px) {
            .chambres-grid {
                /* SUR PETIT TÉLÉPHONE : 4 colonnes */
                grid-template-columns: repeat(4, 1fr);
            }
            h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <h2 style="color:#d4af37">OPIUM NIGHT</h2>
        <input type="text" id="username" placeholder="Identifiant">
        <input type="password" id="password" placeholder="Mot de passe">
        <button id="login-btn" onclick="checkLogin()">ACCÉDER</button>
    </div>

    <div id="main-site">
        <div class="menu-container">
            <div class="bouton-dots" onclick="toggleMenu()">⋮</div>
            <div id="contactCard" class="contact-card">
                <button onclick="toggleMenu()" style="float:right; background:none; border:none; color:gold; font-size:20px;">✕</button>
                <h3 style="color:gold">Personnel</h3>
                <div style="margin-bottom:10px"><strong>Juan de la Rosa</strong><br><small>Réception</small><br>📞 555-1111</div>
                <div style="margin-bottom:10px"><strong>Elena Rico</strong><br><small>Barmaid</small><br>📞 555-3333</div>
                <div style="margin-bottom:10px"><strong>Mr. Opium</strong><br><small>Directeur</small><br>📞 555-5555</div>
                <div style="margin-bottom:10px"><strong>Marco</strong><br><small>Sécurité</small><br>📞 555-6666</div>
            </div>
        </div>

        <h1>OPIUM NIGHT</h1>
        <div id="hotel-layout"></div>
    </div>

    <script>
        const USER = "admin";
        const PASS = "opium2024";

        function checkLogin() {
            if(document.getElementById('username').value === USER && document.getElementById('password').value === PASS) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-site').style.display = 'block';
                renderHotel();
            } else { alert("Accès refusé"); }
        }

        let db = JSON.parse(localStorage.getItem('opiumResa')) || {};

        function renderHotel() {
            const container = document.getElementById('hotel-layout');
            container.innerHTML = "";
            for (let e = 1; e <= 3; e++) {
                let section = document.createElement('div');
                section.className = 'etage-container';
                section.innerHTML = `<h3>Étage ${e}</h3>`;
                let grid = document.createElement('div');
                grid.className = 'chambres-grid';
                
                for (let c = 1; c <= 20; c++) {
                    let num = (e * 100) + c;
                    let box = document.createElement('div');
                    box.className = `chambre ${db[num] ? 'occupe' : 'libre'}`;
                    box.innerText = num;
                    box.onclick = () => handleRoom(num);
                    grid.appendChild(box);
                }
                section.appendChild(grid);
                container.appendChild(section);
            }
        }

        function handleRoom(n) {
            if(!db[n]) {
                let name = prompt("Nom du client :");
                let tel = prompt("Téléphone :", "555-0000");
                if(name && tel) { db[n] = {name, tel}; }
            } else {
                if(confirm(`Occupé par ${db[n].name}\nLibérer ?`)) { delete db[n]; }
            }
            localStorage.setItem('opiumResa', JSON.stringify(db));
            renderHotel();
        }

        function toggleMenu() {
            const m = document.getElementById('contactCard');
            m.style.display = (m.style.display === 'block') ? 'none' : 'block';
        }
    </script>
</body>
</html>
