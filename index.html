<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opium Night - Gestion</title>
    <style>
        /* --- STYLE GÉNÉRAL --- */
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: #0a0a0a;
            color: #e0e0e0;
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* --- CONNEXION --- */
        #login-screen {
            align-self: center;
            background: #1a1a1a;
            padding: 30px;
            border: 1px solid #d4af37;
            border-radius: 15px;
            text-align: center;
            width: 90%;
            max-width: 350px;
        }

        input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: #222;
            border: 1px solid #444;
            color: white;
            border-radius: 8px;
            box-sizing: border-box;
        }

        #login-btn {
            width: 100%;
            padding: 15px;
            background: #d4af37;
            border: none;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        /* --- SITE PRINCIPAL --- */
        #main-site { display: none; width: 100%; max-width: 1200px; padding: 20px; box-sizing: border-box; }
        h1 { color: #d4af37; text-align: center; text-transform: uppercase; }

        /* --- MENU CONTACT (MODIFIÉ) --- */
        .menu-container { position: fixed; top: 15px; right: 15px; z-index: 2000; }
        
        .bouton-dots { 
            background: #d4af37; color: black; width: 50px; height: 50px; 
            border-radius: 10px; display: flex; align-items: center; 
            justify-content: center; font-size: 25px; cursor: pointer;
            user-select: none;
        }

        .contact-card {
            display: none; 
            background: #1a1a1a; 
            border: 1px solid #d4af37;
            padding: 20px; 
            position: absolute; 
            top: 60px; 
            right: 0;
            width: 260px; 
            border-radius: 10px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .btn-logout {
            width: 100%; padding: 10px; margin-top: 15px;
            background: #c0392b; color: white; border: none;
            border-radius: 5px; cursor: pointer; font-weight: bold;
        }

        /* --- GRILLE --- */
        .etage-container { background: #161616; margin: 20px 0; padding: 15px; border-radius: 12px; border-left: 4px solid #d4af37; }
        .chambres-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 8px; margin-top: 10px; }
        .chambre { aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .libre { background: #27ae60; }
        .occupe { background: #c0392b; }

        @media (max-width: 768px) {
            .chambres-grid { grid-template-columns: repeat(5, 1fr); }
        }
        @media (max-width: 480px) {
            .chambres-grid { grid-template-columns: repeat(4, 1fr); }
        }
    </style>
</head>
<body onclick="closeMenuOutside(event)">

    <div id="login-screen">
        <h2 style="color:#d4af37">OPIUM NIGHT</h2>
        <input type="text" id="username" placeholder="Identifiant">
        <input type="password" id="password" placeholder="Mot de passe">
        <button id="login-btn" onclick="checkLogin()">ACCÉDER</button>
    </div>

    <div id="main-site">
        <div class="menu-container" id="menuArea">
            <div class="bouton-dots" onclick="toggleMenu(event)">⋮</div>
            
            <div id="contactCard" class="contact-card">
                <h3 style="color:gold; margin-top:0;">Personnel</h3>
                <div style="margin-bottom:10px;"><strong>Juan de la Rosa</strong><br><small>Réception</small><br>📞 555-8161</div>
                <div style="margin-bottom:10px;"><strong>Esme Almeida</strong><br><small>Barmaid</small><br>📞 555-6158</div>
                <div style="margin-bottom:10px;"><strong>Marco</strong><br><small>Sécurité</small><br>📞 555-3279</div>
                <div style="margin-bottom:10px;"><strong>Phibi Jackson</strong><br><small>Femme de Ménage</small><br>📞 555-1956</div>
                <button class="btn-logout" onclick="logout()">SE DÉCONNECTER</button>
            </div>
        </div>

        <h1>OPIUM NIGHT</h1>
        <div id="hotel-layout"></div>
    </div>

    <script>
        const USER = "admin";
        const PASS = "opium2024";
        let db = JSON.parse(localStorage.getItem('opiumResa')) || {};

        function checkLogin() {
            if(document.getElementById('username').value === USER && document.getElementById('password').value === PASS) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-site').style.display = 'block';
                renderHotel();
            } else { alert("Accès refusé"); }
        }

        function logout() {
            document.getElementById('main-site').style.display = 'none';
            document.getElementById('login-screen').style.display = 'block';
            document.getElementById('contactCard').style.display = 'none';
        }

        // OUVRIR / FERMER LE MENU
        function toggleMenu(event) {
            event.stopPropagation(); // Empêche la fermeture immédiate par closeMenuOutside
            const card = document.getElementById('contactCard');
            card.style.display = (card.style.display === 'block') ? 'none' : 'block';
        }

        // FERMER SI ON CLIQUE AILLEURS
        function closeMenuOutside(event) {
            const card = document.getElementById('contactCard');
            const menuArea = document.getElementById('menuArea');
            if (card.style.display === 'block' && !menuArea.contains(event.target)) {
                card.style.display = 'none';
            }
        }

        function renderHotel() {
            const container = document.getElementById('hotel-layout');
            container.innerHTML = "";
            for (let e = 1; e <= 3; e++) {
                let section = document.createElement('div');
                section.className = 'etage-container';
                section.innerHTML = `<h3>Étage ${e}</h3>`;
                let grid = document.createElement('div');
                grid.className = 'chambres-grid';
                for (let c = 1; c <= 20; c++) {
                    let num = (e * 100) + c;
                    let box = document.createElement('div');
                    box.className = `chambre ${db[num] ? 'occupe' : 'libre'}`;
                    box.innerText = num;
                    box.onclick = () => handleRoom(num);
                    grid.appendChild(box);
                }
                section.appendChild(grid);
                container.appendChild(section);
            }
        }

        function handleRoom(n) {
            if(!db[n]) {
                let name = prompt("Nom du client :");
                let tel = prompt("Téléphone :");
                if(name && tel) db[n] = {name, tel};
            } else {
                if(confirm(`Occupé par ${db[n].name}\nLibérer ?`)) delete db[n];
            }
            localStorage.setItem('opiumResa', JSON.stringify(db));
            renderHotel();
        }
    </script>
</body>
</html>
